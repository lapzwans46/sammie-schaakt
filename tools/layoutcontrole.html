<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layoutcontrole</title>
  <!--
    Controleert of het bord, Pim, de tekstballon en de knoppen op ALLE schermen met een bord
    (lessen, quiz, opdrachten, puzzels, puzzel van de dag, spelletjes, potjes) op dezelfde plek staan,
    ook na een goed antwoord, en of alles op het scherm past.
    Open dit bestand in de browser (dubbelklik), het liefst liggend én staand (of op de iPad).
    Het duurt ongeveer een halve minuut. De titel wordt 'OK' of 'FOUT'.
    Let op: dit wist de voortgang in deze browser voor dit bestand (niet die van de app op de iPad).
  -->
  <link rel="stylesheet" href="../css/style.css">
  <style>
    #report { font: 15px/1.4 system-ui, sans-serif; margin: 20px; color: #222; background: #fff; }
    .sum { font-size: 1.2rem; font-weight: 700; padding: 10px 14px; border-radius: 10px; display: inline-block; }
    .sum.ok { background: #d9ffd9; } .sum.bad { background: #ffe1e1; }
    table { border-collapse: collapse; margin-top: 14px; } td, th { text-align: left; padding: 4px 8px; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <div id="report" hidden>
    <h1>Layoutcontrole Sammie Schaakt!</h1>
    <div id="sum" class="sum">Bezig…</div>
    <pre id="tekst"></pre>
    <table><thead><tr><th>Scherm</th><th>Bord</th><th>Pim</th><th>Ballon</th><th>Knoppen</th><th>Past</th></tr></thead><tbody id="rows"></tbody></table>
  </div>
  <div id="app"></div>
  <script src="../js/chess.js"></script>
  <script src="../js/ai.js"></script>
  <script src="../js/pieces.js"></script>
  <script src="../js/avatars.js"></script>
  <script src="../js/sound.js"></script>
  <script src="../js/board.js"></script>
  <script src="../js/family.js"></script>
  <script src="../js/lessons.js"></script>
  <script src="../js/puzzles.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/editor.js"></script>
  <script src="../js/parents.js"></script>
  <script src="../js/extras.js"></script>
  <script src="../js/games.js"></script>
  <script src="layoutcontrole.js"></script>
</body>
</html>
